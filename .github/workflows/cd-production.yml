# .github/workflows/cd-production.yml
#
# Section 4.1's explicit choice: Continuous DELIVERY, not Continuous
# DEPLOYMENT — this workflow exists and is ready, but requires a human
# to actually trigger it. Nothing reaches production automatically.

name: Deploy to Production

on:
  workflow_dispatch:
    # Section 4.1: "workflow_dispatch" means this workflow ONLY runs
    # when a human explicitly clicks "Run workflow" — never automatically.
    inputs:
      confirm_sha:
        description: "Full 40-character Git SHA of the staging-verified image to promote"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
      # The "production" GitHub Environment can additionally require a
      # reviewer's approval before this job starts — a second human gate
      # on top of the manual trigger (Section 5.4, Step 6).
    env:
      APP_URL: ${{ vars.PRODUCTION_URL }}
      DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      SHA: ${{ inputs.confirm_sha }}
      # The input reaches the script through an environment variable,
      # never pasted into the script text with ${{ }}: text typed into
      # a form must not be able to inject shell commands.

    steps:
      - name: Validate the requested SHA
        run: |
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::confirm_sha must be a full 40-character lowercase Git SHA"
            exit 1
          fi

      - name: Deploy the staging-verified image to production
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/inkwell-server:${SHA}"
          echo "Deploying $IMAGE"
          curl -fsS -X POST "${DEPLOY_HOOK}&imgURL=${IMAGE}"

      - name: Wait for production to respond
        run: |
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 30 "$APP_URL/api/health"; then
              echo; echo "Production answered on attempt $attempt"; exit 0
            fi
            sleep 15
          done
          echo "::error::Production did not answer within 10 minutes"; exit 1

      - name: Run production smoke tests
        run: |
          curl -fsS --max-time 30 "$APP_URL/api/health"; echo
          curl -fsS --max-time 30 "$APP_URL/api/posts?page=1" > /dev/null
          echo "Smoke tests passed"
