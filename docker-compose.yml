# docker-compose.yml (repository root)
#
# Section 4.7's networking and Section 4.6's volumes, both declared
# here in one file — the entire local development topology as a
# single, reviewable, version-controlled artifact (Lecture 17's SCM
# discipline, extended to infrastructure, not just application code).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inkwell
      POSTGRES_PASSWORD: inkwell
      POSTGRES_DB: inkwell_dev
    ports:
      - "5433:5432"
      # Host port 5433, not 5432: a local Postgres (like the test database
      # in server/.env.test) usually already holds 5432 on your machine.
      # The server never uses this mapping; it reaches db:5432 over
      # Docker's internal network. It exists so you can inspect the
      # database from your machine (e.g. psql -h localhost -p 5433).
    volumes:
      - inkwell_db_data:/var/lib/postgresql/data
      # Section 4.6: this volume ensures the database's actual data
      # survives even if the "db" container is stopped and recreated.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inkwell -d inkwell_dev"]
      interval: 2s
      timeout: 5s
      retries: 15

  server:
    build: ./server
    environment:
      DATABASE_URL: postgresql://inkwell:inkwell@db:5432/inkwell_dev
      # Section 4.7: "db" here is not an IP address — it's the SERVICE
      # NAME above, which Docker Compose automatically resolves to
      # wherever the db container is actually running.
      #
      # The token secrets must reach the container, because server/.env is
      # dockerignored. Without them, the server would silently fall back to
      # TokenService's hardcoded dev secrets (Lecture 6), undoing Lecture
      # 16's A02 fix. They are NOT written here: this file is committed,
      # and a secret in version control is a leaked secret (Factor III:
      # config lives in the environment, not the code). Compose fills
      # ${...} from a .env file next to this one; :? stops startup with
      # an error if a value is missing.
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?set ACCESS_TOKEN_SECRET in .env}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?set REFRESH_TOKEN_SECRET in .env}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
        # A plain "depends_on: [db]" only waits for the db container to
        # START, not for Postgres to accept connections. The healthcheck
        # above makes the server wait until pg_isready succeeds; the
        # entrypoint's retry loop remains as a backstop.

volumes:
  inkwell_db_data:
